menus:
  info:
    title: '&8Tablero &6&l{name}'
    items:
      banner:
        slot: 4
        name: '&f&lEstandarte oficial'
        lore:
          - ''
          - '&7Muestra el estandarte'
          - '&7oficial del clan.'
          - ''
          - '&8Para cambiarlo usa Ajustes.'
          - '&8Sin banner: WHITE_BANNER.'
          - ''
          - '&eClick para ver.'
      requests:
        slot: 9
        material: PLAYER_HEAD
        name: '&a&lSolicitudes pendientes'
        lore:
          - ''
          - '&7Jugadores que quieren entrar'
          - '&7cuando el clan está restringido.'
          - ''
          - '&7Pendientes: &e{join_requests}'
          - ''
          - '&eClick para abrir.'
      description:
        slot: 10
        material: MAP
        name: '&6&lDescripción pública'
        lore:
          - ''
          - '&7Visible en la lista de clanes'
          - '&7y en la información pública.'
          - ''
          - '&f{description_line_1}'
          - '&f{description_line_2}'
          - '&f{description_line_3}'
          - '&f{description_line_4}'
          - '&f{description_line_5}'
          - ''
          - '&eClick: ver descripción.'
          - '&8Se edita desde Ajustes.'
      board:
        slot: 11
        material: WRITABLE_BOOK
        name: '&e&lTablero de información'
        lore:
          - ''
          - '&7Mensaje del clan:'
          - '&f{board_line_1}'
          - '&f{board_line_2}'
          - '&f{board_line_3}'
          - '&f{board_line_4}'
          - '&f{board_line_5}'
          - '&f{board_line_6}'
          - '&f{board_line_7}'
          - '&f{board_line_8}'
          - '&f{board_line_9}'
          - '&f{board_line_10}'
          - ''
          - '&eClick: ver mensaje.'
          - '{board_edit_hint}'
      mailbox:
        slot: 13
        material: CHEST
        name: '&d&lBuzón del clan'
        lore:
          - ''
          - '&7Mensajes enviados por'
          - '&7otros clanes.'
          - ''
          - '&7Todos pueden leer.'
          - '&7Rangos altos pueden'
          - '&7responder o eliminar.'
          - ''
          - '&eClick para abrir.'
      logs:
        slot: 15
        material: BOOK
        name: '&6&lRegistros del clan'
        lore:
          - ''
          - '&7Muestra acciones recientes.'
          - '&8Puedes filtrar por categoría'
          - '&8desde el menú de registros.'
          - ''
          - '{can_logs}'
          - ''
          - '&eClick para abrir.'
      summary:
        slot: 16
        material: MAP
        name: '&f&lResumen del clan'
        lore:
          - ''
          - '&7Clan: &f{name}'
          - '&7ID: &6{id}'
          - '&7Creado: &f{created}'
          - '&7Tier: &d{clan_tier_name}'
          - '&7Miembros: &e{members}&7/&e{max_members}'
          - '&7Bases: &e{bases}&7/&e{max_bases}'
          - '&7Almacén: &e{storage_display}'
          - '&7Aliados: &e{allies}&7/&e{max_allies}'
          - '&7Banco: &e{bank}'
          - ''
          - '&8Información general.'
      permissions:
        slot: 17
        material: KNOWLEDGE_BOOK
        name: '&b&lPermisos y rangos'
        lore:
          - ''
          - '&7Mira qué puede hacer'
          - '&7cada rango del clan.'
          - ''
          - '&eClick para abrir.'
    back:
      slot: 22
      action: MDVSOCIAL
      target: clan_con_clan
      material: PLAYER_HEAD
      texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ==
      name: '&6&lVolver'
      lore:
        - '&7Regresa al menú de clanes.'

  mailbox:
    title: '&8Buzón del clan'
    mail-item:
      name: '&6&l#&f{mail_id} &8- &d{from_name}'
      lore:
        - ''
        - '&7De: &d{from_name} &8[&6{from_id}&8]'
        - '&7Mensajero: &e{sender}'
        - '&7Fecha: &a{date}'
        - ''
        - '&6&lContenido:'
        - '&f{message_line_1}'
        - '&f{message_line_2}'
        - '&f{message_line_3}'
        - '&f{message_line_4}'
        - '&f{message_line_5}'
        - ''
        - '&eClick para abrir opciones.'
    back:
      slot: 49
      action: NATIVE
      target: info
      material: PLAYER_HEAD
      texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ==
      name: '&6&lVolver'
      lore:
        - '&7Regresa al tablero de información.'

  logs:
    title: '&8Registros: &6{filter}'
    filters:
      all: {slot: 1, material: BOOK, name: '&eTodos', lore: ['{active}']}
      miembros: {slot: 2, material: PLAYER_HEAD, name: '&aMiembros', lore: ['{active}']}
      banco: {slot: 3, material: GOLD_NUGGET, name: '&eBanco', lore: ['{active}']}
      diplomacia: {slot: 4, material: BLUE_BANNER, name: '&9Diplomacia', lore: ['{active}']}
      correo: {slot: 5, material: WRITABLE_BOOK, name: '&dCorreo', lore: ['{active}']}
      combate: {slot: 6, material: IRON_SWORD, name: '&cCombate', lore: ['{active}']}
      admin: {slot: 7, material: COMPARATOR, name: '&6Admin', lore: ['{active}']}
    log-item:
      material: PAPER
      name: '&e#{log_id} &6{action}'
      lore:
        - ''
        - '&7Categoría: &e{category}'
        - '&7Actor: &f{actor}'
        - '&7Fecha: &f{date}'
        - ''
        - '&7{detail}'
        - ''
        - '&8Click derecho admin: borrar log.'
    back:
      slot: 49
      action: NATIVE
      target: info
      material: PLAYER_HEAD
      texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ==
      name: '&6&lVolver'
      lore:
        - '&7Regresa al tablero de información.'

  join-requests:
    title: '&8Solicitudes &6{id}'
    request-head:
      name: '&e&l{player}'
      lore:
        - ''
        - '&6&lSolicitud de ingreso'
        - '&7Jugador: &e{player}'
        - '&7Estado: {status}'
        - '&7Enviada: &f{requested}'
        - ''
        - '&6&lPerfil'
        - '&7Nivel: &e{level}'
        - '&7Raza: &d{race}'
        - ''
        - '&8&m------------------------'
        - '&aClick izquierdo &7para aceptar.'
        - '&cClick derecho &7para rechazar.'
    back:
      slot: 49
      action: NATIVE
      target: info
      material: PLAYER_HEAD
      texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ==
      name: '&6&lVolver'
      lore:
        - '&7Regresa al tablero de información.'

  permissions:
    title: '&8Permisos &7({page}/{max_page})'
    table:
      rows-per-page: 4
      role-header-slots: [3, 4, 5, 6, 7]
      permission-row-start-slots: [9, 18, 27, 36]
    role-header:
      material: GRAY_BANNER
      name: '&6&lRango {role_number}'
      lore:
        - '&f{role_name}'
        - ''
        - '&7Columna de permisos'
        - '&7para este rango.'
    permission-item:
      material: BOOK
      name: '&e#{permission_index} {permission_name}'
      lore:
        - ''
        - '&7Descripción:'
        - '{permission_description}'
        - ''
        - '&7Rango requerido: &6{required_rank}'
        - '&7Nombre del rango: &f{required_role}'
        - ''
        - '&8Las lanas de la derecha indican'
        - '&8si cada rango tiene el permiso.'
        - '&8Solo lectura: se edita en Ajustes.'
    allowed-item:
      material: LIME_WOOL
      name: '&a✔ Permitido'
      lore:
        - '&7Rango: &6{role_number} &8- &f{role_name}'
        - '&7Permiso: {permission_name}'
        - ''
        - '&aEste rango puede usarlo.'
    denied-item:
      material: RED_WOOL
      name: '&c✖ Bloqueado'
      lore:
        - '&7Rango: &6{role_number} &8- &f{role_name}'
        - '&7Permiso: {permission_name}'
        - ''
        - '&cEste rango no puede usarlo.'
    back:
      slot: 49
      action: NATIVE
      target: info
      material: PLAYER_HEAD
      texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ==
      name: '&6&lVolver'
      lore:
        - '&7Regresa al tablero de información.'
