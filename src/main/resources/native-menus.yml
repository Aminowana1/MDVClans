      name: '&6&lVolver'
      lore:
      - '&7Regresa a gestión del clan.'
      action: NATIVE
      target: gestion
  storage:
    back:
      slot: 22
      material: ARROW
      name: '&6&lVolver'
      lore:
      - '&7Regresa a gestión del clan.'
      action: NATIVE
      target: gestion
  clan-list:
