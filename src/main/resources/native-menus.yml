      - '&7Regresa a información del clan.'
      action: NATIVE
      target: info
  logs:
    back:
      slot: 49
      material: ARROW
      name: '&6&lVolver'
      lore:
      - '&7Regresa a información del clan.'
      action: NATIVE
      target: info
  settings:
    back:
      slot: 49
      material: ARROW
      name: '&6&lVolver'
      lore:
      - '&7Regresa a gestión del clan.'
      action: NATIVE
      target: gestion
  role-settings:
    back:
      slot: 22
      material: ARROW
      name: '&6&lVolver'
      lore:
      - '&7Regresa a ajustes del clan.'
      action: NATIVE
      target: ajustes
  permissions:
    back:
      slot: 49
      material: ARROW
      name: '&6&lVolver'
      lore:
      - '&7Regresa a ajustes del clan.'
      action: NATIVE
      target: ajustes
  join-requests:
    back:
      slot: 49
      material: ARROW
      name: '&6&lVolver'
      lore:
      - '&7Regresa a información del clan.'
      action: NATIVE
      target: info
  member-action:
    back:
      slot: 22
      material: ARROW
      name: '&6&lVolver'
      lore:
      - '&7Regresa a miembros del clan.'
      action: NATIVE
      target: miembros
  clan-action:
    back:
      slot: 22
      material: ARROW
      name: '&6&lVolver'
      lore:
      - '&7Regresa a la lista de clanes.'
      action: NATIVE
      target: lista
  mail-action:
    back:
      slot: 22
      material: ARROW
      name: '&6&lVolver'
      lore:
      - '&7Regresa al buzón del clan.'
      action: NATIVE
      target: correo
back-examples:
  # Esto es solo documentación, no lo usa el plugin.
  native:
    action: NATIVE
    target: gestion
  mdvsocial:
    action: MDVSOCIAL
    target: clan_con_clan
  command:
    action: COMMAND
    command: 'social main'
  close:
    action: CLOSE
  previous:
    action: PREVIOUS
