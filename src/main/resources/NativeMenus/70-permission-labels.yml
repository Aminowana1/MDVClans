permission-labels:
  invite:
    name: '&aInvitar miembros'
    material: LIME_WOOL
    description: ['&7Permite invitar jugadores', '&7a entrar al clan.']
  kick:
    name: '&cExpulsar miembros'
    material: RED_WOOL
    description: ['&7Permite expulsar miembros', '&7de menor jerarquía.']
  promote:
    name: '&aPromover miembros'
    material: LIME_WOOL
    description: ['&7Permite subir el rango', '&7de otros miembros.']
  demote:
    name: '&eDegradar miembros'
    material: YELLOW_WOOL
    description: ['&7Permite bajar el rango', '&7de otros miembros.']
  set-rank:
    name: '&dAsignar rango exacto'
    material: MAGENTA_WOOL
    description: ['&7Permite asignar un rango', '&7numérico específico.']
