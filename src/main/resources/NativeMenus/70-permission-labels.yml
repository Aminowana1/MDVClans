    name: '&eCambiar nombre del clan'
    material: YELLOW_WOOL
    description: ['&7Permite cambiar el nombre', '&7formal del clan.']
  rename-tag:
    name: '&bCambiar ID del clan'
    material: LIGHT_BLUE_WOOL
    description: ['&7Permite cambiar el ID/tag', '&7visible del clan.']
  settings:
    name: '&6Abrir ajustes'
    material: ORANGE_WOOL
    description: ['&7Permite acceder al panel', '&7de ajustes del clan.']
  permissions-edit:
    name: '&bAdministrar permisos'
    material: LIGHT_BLUE_WOOL
    description: ['&7Permite abrir el editor', '&7de permisos por rol.']
  tier-upgrade:
    name: '&dMejorar clan'
    material: PURPLE_WOOL
    description: ['&7Permite gastar dinero del banco', '&7para subir el tier del clan.']
  disband:
    name: '&4Disolver clan'
    material: RED_WOOL
    description: ['&7Permite disolver el clan.', '&cAcción peligrosa.']

  description-edit:
    name: '&6Editar descripción pública'
    material: ORANGE_WOOL
    description: ['&7Permite cambiar la descripción', '&7pública visible del clan.']
