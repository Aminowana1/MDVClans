    name: '&dRenombrar rangos'
    material: PURPLE_WOOL
    description: ['&7Permite cambiar el nombre', '&7visible de los rangos.']
  setbase:
    name: '&bFijar base'
    material: LIGHT_BLUE_WOOL
    description: ['&7Permite definir la base', '&7de teletransporte del clan.']
  relation:
    name: '&9Gestionar relaciones'
    material: BLUE_WOOL
    description: ['&7Permite declarar aliados,', '&7enemigos o neutralidad.']
  open:
    name: '&aAbrir/cerrar clan'
    material: GREEN_WOOL
    description: ['&7Permite cambiar si el clan', '&7es abierto o por solicitud.']
  bank-deposit:
    name: '&eDepositar banco'
    material: YELLOW_WOOL
    description: ['&7Permite depositar monedas', '&7en el banco del clan.']
  bank-withdraw:
    name: '&6Retirar banco'
    material: ORANGE_WOOL
    description: ['&7Permite retirar monedas', '&7del banco del clan.']
  storage-open:
    name: '&aAbrir almacén'
    material: GREEN_WOOL
