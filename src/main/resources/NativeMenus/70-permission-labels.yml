    name: '&6Ver registros'
    material: ORANGE_WOOL
    description: ['&7Permite ver registros', '&7internos del clan.']
  board-edit:
    name: '&eEditar tablero'
    material: YELLOW_WOOL
    description: ['&7Permite editar el tablero', '&7de información del clan.']
  mail-send:
    name: '&dEnviar correos de clan'
    material: MAGENTA_WOOL
    description: ['&7Permite enviar y responder', '&7correos entre clanes.']
  mail-delete:
    name: '&cBorrar correos de clan'
    material: RED_WOOL
    description: ['&7Permite eliminar correos', '&7del buzón del clan.']
  join-requests:
    name: '&aGestionar solicitudes'
    material: LIME_WOOL
