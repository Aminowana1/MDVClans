permission-labels:
  invite:
    material: YELLOW_WOOL
    name: '&aInvitar miembros'
    description:
    - '&7Permite invitar jugadores'
    - '&7a entrar al clan.'
  kick:
    material: RED_WOOL
    name: '&cExpulsar miembros'
    description:
    - '&7Permite expulsar miembros'
    - '&7de menor jerarquía.'
  promote:
    material: LIME_WOOL
    name: '&aPromover miembros'
    description:
    - '&7Permite subir el rango'
    - '&7de otros miembros.'
  demote:
    material: YELLOW_WOOL
    name: '&eDegradar miembros'
    description:
    - '&7Permite bajar el rango'
    - '&7de otros miembros.'
  set-rank:
    material: PURPLE_WOOL
    name: '&dAsignar rango'
    description:
    - '&7Permite asignar un rango'
    - '&7numérico exacto.'
  rename-role:
    material: MAGENTA_WOOL
    name: '&dRenombrar rangos'
    description:
    - '&7Permite cambiar el nombre'
    - '&7visible de los rangos.'
  setbase:
    material: LIGHT_BLUE_WOOL
    name: '&bFijar base'
    description:
    - '&7Permite definir la base'
    - '&7de teletransporte del clan.'
  relation:
    material: BLUE_WOOL
    name: '&9Gestionar relaciones'
    description:
    - '&7Permite declarar aliados,'
    - '&7enemigos o neutralidad.'
  open:
    material: GREEN_WOOL
    name: '&aAbrir/cerrar clan'
    description:
    - '&7Permite cambiar si el clan'
    - '&7es abierto o por solicitud.'
  bank-deposit:
    material: LIME_WOOL
    name: '&eDepositar banco'
    description:
    - '&7Permite depositar monedas'
    - '&7en el banco del clan.'
  bank-withdraw:
    material: ORANGE_WOOL
    name: '&6Retirar banco'
    description:
    - '&7Permite retirar monedas'
    - '&7del banco del clan.'
  storage-open:
    material: GREEN_WOOL
    name: '&aAbrir almacén'
    description:
    - '&7Permite abrir el almacén'
    - '&7compartido del clan.'
  banner-set:
    material: WHITE_WOOL
    name: '&fCambiar estandarte'
    description:
    - '&7Permite guardar o quitar'
    - '&7el estandarte oficial.'
  logs-view:
    material: BROWN_WOOL
    name: '&6Ver registros'
    description:
    - '&7Permite ver registros'
    - '&7internos del clan.'
  board-edit:
    material: YELLOW_WOOL
    name: '&eEditar tablero'
    description:
    - '&7Permite editar el tablero'
    - '&7de información del clan.'
  mail-send:
    material: PINK_WOOL
    name: '&dEnviar correos de clan'
    description:
    - '&7Permite enviar y responder'
    - '&7correos entre clanes.'
  mail-delete:
    material: RED_WOOL
    name: '&cBorrar correos de clan'
    description:
    - '&7Permite eliminar correos'
    - '&7del buzón del clan.'
  join-requests:
    material: LIME_WOOL
    name: '&aGestionar solicitudes'
    description:
    - '&7Permite aceptar o rechazar'
    - '&7solicitudes de ingreso.'
  rename-clan:
    material: YELLOW_WOOL
    name: '&eCambiar nombre del clan'
    description:
    - '&7Permite cambiar el nombre'
    - '&7formal del clan.'
  rename-tag:
    material: LIGHT_BLUE_WOOL
    name: '&bCambiar ID del clan'
    description:
    - '&7Permite cambiar el ID/tag'
    - '&7visible del clan.'
  settings:
    material: ORANGE_WOOL
    name: '&6Abrir ajustes'
    description:
    - '&7Permite acceder al panel'
    - '&7de ajustes del clan.'
  disband:
    material: BLACK_WOOL
    name: '&4Disolver clan'
    description:
    - '&7Permite disolver el clan.'
    - '&cAcción peligrosa.'
