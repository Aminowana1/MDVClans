menus:
  info:
    title: '&8Tablero &b{id}'
    items:
      banner:
        slot: 4
        name: '&f&lEstandarte oficial'
        lore:
        - ''
        - '&7Muestra el estandarte'
        - '&7oficial del clan.'
        - ''
        - '&8Para cambiarlo usa Ajustes.'
        - '&8Sin banner: WHITE_BANNER.'
        - ''
        - '&eClick para ver.'
      board:
        slot: 11
        material: WRITABLE_BOOK
        name: '&e&lTablero de información'
        lore:
        - ''
        - '&7Mensaje del clan:'
        - '&f{board}'
        - ''
        - '&eClick: ver mensaje.'
        - '{board_edit_hint}'
      requests:
        slot: 9
        material: PLAYER_HEAD
        name: '&a&lSolicitudes pendientes'
        lore:
        - ''
        - '&7Jugadores que quieren entrar'
        - '&7cuando el clan está restringido.'
        - ''
        - '&7Pendientes: &e{join_requests}'
        - ''
        - '&eClick para abrir.'
      mailbox:
        slot: 13
        material: CHEST
        name: '&d&lBuzón del clan'
        lore:
        - ''
        - '&7Mensajes enviados por'
        - '&7otros clanes.'
        - ''
        - '&7Todos pueden leer.'
        - '&7Rangos altos pueden'
        - '&7responder o eliminar.'
        - ''
        - '&eClick para abrir.'
      logs:
        slot: 15
        material: BOOK
        name: '&6&lRegistros del clan'
        lore:
        - ''
        - '&7Muestra acciones recientes:'
        - '&8miembros, banco, base,'
        - '&8relaciones y bajas.'
        - ''
        - '{can_logs}'
        - ''
        - '&eClick para abrir.'
      permissions:
        slot: 17
        material: KNOWLEDGE_BOOK
        name: '&b&lPermisos y rangos'
        lore:
        - ''
        - '&7Mira qué puede hacer'
        - '&7cada rango del clan.'
        - ''
        - '&eClick para abrir.'
      summary:
        slot: 16
        material: MAP
        name: '&f&lResumen del clan'
        lore:
        - ''
        - '&7Clan: &f{name}'
        - '&7ID: &b{id}'
        - '&7Creado: &f{created}'
        - '&7Miembros: &e{members}'
        - '&7Banco: &e{bank}'
        - ''
        - '&8Información general.'
    back:
      slot: 22
      action: MDVSOCIAL
      target: clan_con_clan
      material: PLAYER_HEAD
      texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ==
      name: '&6&lVolver'
      lore:
      - '&7Regresa al menú de clanes.'
  mailbox:
    title: '&8Buzón del clan'
    mail-item:
      name: '&dCorreo #{mail_id} &7de &b{from_id}'
      lore:
      - '&7Enviado por: &f{sender}'
      - '&7Fecha: &f{date}'
      - ''
      - '&f{message}'
      - ''
      - '&eClick: abrir opciones'
    back:
      slot: 49
