menus:
  info:
    title: '&8Tablero &b{id}'
    items:
      banner:
        slot: 4
        name: '&f&lEstandarte oficial'
        lore:
          - ''
          - '&7Muestra el estandarte'
          - '&7oficial del clan.'
          - ''
          - '&8Para cambiarlo usa Ajustes.'
          - '&8Sin banner: WHITE_BANNER.'
          - ''
          - '&eClick para ver.'
      board:
        slot: 11
        material: WRITABLE_BOOK
        name: '&e&lTablero de información'
        lore:
          - ''
          - '&7Mensaje del clan:'
          - '&f{board_line_1}'
          - '&f{board_line_2}'
          - '&f{board_line_3}'
          - '&f{board_line_4}'
          - '&f{board_line_5}'
          - '&f{board_line_6}'
          - '&f{board_line_7}'
          - '&f{board_line_8}'
          - '&f{board_line_9}'
          - '&f{board_line_10}'
          - ''
          - '&eClick: ver mensaje.'
          - '{board_edit_hint}'
      requests:
        slot: 9
        material: PLAYER_HEAD
        name: '&a&lSolicitudes pendientes'
        lore:
          - ''
          - '&7Jugadores que quieren entrar'
          - '&7cuando el clan está restringido.'
          - ''
          - '&7Pendientes: &e{join_requests}'
          - ''
          - '&eClick para abrir.'
      mailbox:
        slot: 13
        material: CHEST
        name: '&d&lBuzón del clan'
        lore:
          - ''
          - '&7Mensajes enviados por'
          - '&7otros clanes.'
          - ''
          - '&7Todos pueden leer.'
          - '&7Rangos altos pueden'
          - '&7responder o eliminar.'
          - ''
          - '&eClick para abrir.'
      logs:
        slot: 15
        material: BOOK
        name: '&6&lRegistros del clan'
        lore:
          - ''
          - '&7Muestra acciones recientes:'
          - '&8miembros, banco, base,'
          - '&8relaciones y bajas.'
          - ''
          - '{can_logs}'
          - ''
          - '&eClick para abrir.'
      permissions:
        slot: 17
        material: KNOWLEDGE_BOOK
        name: '&b&lPermisos y rangos'
        lore:
          - ''
          - '&7Mira qué puede hacer'
          - '&7cada rango del clan.'
          - ''
          - '&eClick para abrir.'
      summary:
        slot: 16
        material: MAP
        name: '&f&lResumen del clan'
        lore:
          - ''
          - '&7Clan: &f{name}'
          - '&7ID: &b{id}'
          - '&7Creado: &f{created}'
          - '&7Miembros: &e{members}'
          - '&7Banco: &e{bank}'
          - ''
          - '&8Información general.'
    back:
      slot: 22
      action: MDVSOCIAL
      target: clan_con_clan
      material: PLAYER_HEAD
      texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ==
      name: '&6&lVolver'
      lore:
        - '&7Regresa al menú de clanes.'

  mailbox:
    title: '&8Buzón del clan'
    mail-item:
      name: '&dCorreo #{mail_id} &7de &b{from_id}'
      lore:
        - '&7Enviado por: &f{sender}'
        - '&7Fecha: &f{date}'
        - ''
        - '&f{message}'
        - ''
        - '&eClick: abrir opciones'
    back:
      slot: 49
      action: NATIVE
      target: info
      material: PLAYER_HEAD
      texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ==
      name: '&6&lVolver'
      lore:
        - '&7Regresa al tablero de información.'

  logs:
    title: '&8Registros del clan'
    log-item:
      material: PAPER
      name: '&e{action}'
      lore:
        - '&7Actor: &f{actor}'
        - '&7Fecha: &f{date}'
        - ''
        - '&7{detail}'
    back:
      slot: 49
      action: NATIVE
      target: info
      material: PLAYER_HEAD
      texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ==
      name: '&6&lVolver'
      lore:
        - '&7Regresa al tablero de información.'

  join-requests:
    title: '&8Solicitudes &b{id}'
    request-head:
      name: '&e{player}'
      lore:
        - '&7Estado: {status}'
        - '&7Solicitud: &f{requested}'
        - '&7Nivel: &e{level}'
        - '&7Raza: &d{race}'
        - ''
        - '{manage_hint}'
    back:
      slot: 49
      action: NATIVE
      target: info
      material: PLAYER_HEAD
      texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ==
      name: '&6&lVolver'
      lore:
        - '&7Regresa al tablero de información.'

  permissions:
    title: '&8Permisos &7({page}/{max_page})'
    table:
      rows-per-page: 4
      role-header-slots: [3, 4, 5, 6, 7, 8]
      permission-row-start-slots: [9, 18, 27, 36]
    role-header:
      material: GRAY_BANNER
      name: '&bRango {role_number}'
      lore:
        - '&f{role_name}'
        - ''
        - '&7Columna de permisos'
        - '&7para este rango.'
    permission-item:
      material: BOOK
      name: '&e#{permission_index} {permission_name}'
      lore:
        - ''
        - '&7Descripción:'
        - '{permission_description}'
        - ''
        - '&7Rango requerido: &b{required_rank}'
        - '&7Nombre del rango: &f{required_role}'
        - ''
        - '&8Las lanas de la derecha indican'
        - '&8si cada rango tiene el permiso.'
    allowed-item:
      material: LIME_WOOL
      name: '&a✔ Permitido'
      lore:
        - '&7Rango: &b{role_number} &8- &f{role_name}'
        - '&7Permiso: {permission_name}'
        - ''
        - '&aEste rango puede usarlo.'
    denied-item:
      material: RED_WOOL
      name: '&c✖ Bloqueado'
      lore:
        - '&7Rango: &b{role_number} &8- &f{role_name}'
        - '&7Permiso: {permission_name}'
        - ''
        - '&cEste rango no puede usarlo.'
    back:
      slot: 49
      action: NATIVE
      target: info
      material: PLAYER_HEAD
      texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ==
      name: '&6&lVolver'
      lore:
        - '&7Regresa al tablero de información.'
