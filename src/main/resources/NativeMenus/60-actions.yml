menus:
  member-action:
    title: '&8Miembro &b{player}'
    items:
      member:
        slot: 4
      mail:
        slot: 10
        material: MAP
        name: '&d&lCorreo personal'
        lore:
          - ''
          - '&7Escribe una carta privada'
          - '&7a este jugador desde el chat.'
          - ''
          - '&eClick para escribir.'
      promote:
        slot: 11
        material: LIME_DYE
        name: '&a&lPromover'
        lore:
          - ''
          - '&7Sube un rango al miembro.'
          - ''
          - '&eClick para promover.'
      demote:
        slot: 12
        material: YELLOW_DYE
        name: '&e&lDegradar'
        lore:
          - ''
          - '&7Baja un rango al miembro.'
          - ''
          - '&eClick para degradar.'
      kick:
        slot: 14
        material: RED_DYE
        name: '&c&lExpulsar'
        lore:
          - ''
          - '&7Expulsa al miembro del clan.'
          - '&cAcción delicada.'
          - ''
          - '&eClick para expulsar.'
      profile:
        slot: 16
        material: BOOK
        name: '&b&lVer perfil'
        lore:
          - ''
          - '&7Información básica del jugador.'
          - '&7Más perfil se puede conectar'
          - '&7con MDVSocial/MMOCore luego.'
    back:
      slot: 22
      action: NATIVE
      target: miembros
