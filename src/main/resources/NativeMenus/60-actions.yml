          - '&7Entrada: {entry}'
          - '&7Fuerza: &6{strength}'
      join:
        slot: 13
        material: LIME_DYE
        name: '&a&lUnirse'
        lore:
          - ''
          - '&7Este clan está abierto.'
          - ''
          - '&eClick para unirte.'
      request:
        slot: 13
        material: PAPER
        name: '&e&lEnviar solicitud'
        lore:
          - ''
          - '&7Este clan es por invitación.'
          - '&7Enviarás una solicitud de ingreso.'
          - ''
          - '&eClick para solicitar.'
      info:
        slot: 10
        material: BOOK
        name: '&b&lVer info'
        lore:
          - ''
          - '&eClick para ver información.'
      ally:
        slot: 11
        material: BLUE_DYE
        name: '&9&lProponer alianza'
        lore:
          - ''
          - '&7Envía/acepta relación aliada.'
