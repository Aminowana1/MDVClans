prefix: '&8[&6MDVClans&8]&r '

storage:
  # V1.5: carpeta separada para dejar todo más ordenado y facilitar migración futura a MySQL.
  type: SQLITE
  sqlite-file: 'Data/clans.db'
  mysql:
    enabled: false
    host: 'localhost'
    port: 3306
    database: 'mdvcraft'
    username: 'root'
    password: ''

worlds:
  # Si está vacío, permite todos. Recomendado para MDVCRAFT: world, world_nether, world_the_end.
  allowed: ['world', 'world_nether', 'world_the_end']

creation:
  enabled: true
  cost-enabled: false
  cost: 10.0
  id-min: 3
  id-max: 5
  name-min: 3
  name-max: 19
  id-regex: '^[A-Za-z0-9]+$'

limits:
  max-clans: 60
  max-members: 20

invites:
  expire-seconds: 120

roles:
  min: 0
  max: 5
  defaults:
    '0': 'Recluta'
    '1': 'Plebeyo'
    '2': 'Caballero'
    '3': 'Conde'
    '4': 'Noble'
    '5': 'Líder'

rank-permissions:
  invite: 3
  kick: 3
  promote: 4
  demote: 4
  set-rank: 5
  rename-role: 5
  setbase: 4
  relation: 4
  open: 4
  disband: 5
  bank-deposit: 0
  bank-withdraw: 4
  storage-open: 0
  banner-set: 4
  logs-view: 4
  board-edit: 4
  mail-send: 4
  mail-delete: 4
  settings: 4
  rename-tag: 5
  rename-clan: 5
  join-requests: 3

chat:
  format: '&8[&3Clan&8] &b{player}&7: &f{message}'
  spy-permission: 'mdvclans.admin'

base:
  teleport-delay-seconds: 10
  cooldown-seconds: 60
  cancel-on-move: true
  cancel-on-damage: true

friendly-fire:
  cancel-members: true
  cancel-allies: false
  message-cooldown-seconds: 3

relations:
  # Aliado necesita confirmación del otro clan.
  ally-requires-accept: true

bank:
  enabled: true

storage-chest:
  enabled: true
  size: 27
  title: '&8Almacén de clan {id}'

logs:
  enabled: true

kills:
  enabled: true
  # Anti-farmeo: el mismo atacante no puede sumar puntos contra la misma víctima durante este tiempo.
  same-victim-cooldown-seconds: 900

top:
  strength:
    kill-weight: 10.0
    bank-divisor: 10.0
    bank-cap: 500.0
    member-weight: 5.0

nametags:
  enabled: true
  update-interval-ticks: 100
  formats:
    same: '&a[{id}] '
    ally: '&9[{id}] '
    enemy: '&c[{id}] '
    neutral: '&7[{id}] '

placeholders:
  no-clan: ''
  tag-format: '&8[&b{id}&8]&r'
  lpc-tag-format: '&8[&b{id}&8]&r '


gui:
  native-enabled: true
  # Los menús nativos se abren con /clan abrir <ui>.
  # Edita títulos/items/lore en native-menus.yml.
  # MDVSocial debe crear sus propios puentes y ejecutar /clan abrir <ui>.
